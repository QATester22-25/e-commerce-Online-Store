<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-commerce-Online Store</title>
  <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
  
<header>
  <div class="top_header">
    <div class="container">
      <a href="#" class="logo">
        <img src="img/logo.png" alt="logo">
      </a>

      <form action="" class="search_box">
        <div class="select_box">
          <select id="category" name="category">
            <option value="All Categories">All Categories</option>
            <option value="Electronics & Digital">Electronics & Digital</option>
            <option value="Phones & Tablets">Phones & Tablets</option>
            <option value="Fashion & Clothings">Fashion & Clothings</option>
            <option value="Television & Monitor">Television & Monitor</option>
            <option value="Jewerly & Watches">Jewerly & Watches</option>
            <option value="Washing Machine">Washing Machine</option>
            <option value="Toys & Hobbies">Toys & Hobbies</option>
          </select>
        </div>

        <input type="text" name="search" id="search" placeholder="Search For Products" required>
        <button  type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <div class="header_icons">
        <div class="icon"><a href="#">
          <i class="fa-regular fa-heart"></i>
          <span class="count count_favorite">0</span>
        </a></div>
        <div class="icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="count count_item_header">0</span>
        </div>
      </div>
    </div>
  </div>
</header>



  <script src="JS/main.js"></script>
</body>
</html>
